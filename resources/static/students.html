<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Students - SMS</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar">
  <a class="navbar-brand" href="index.html">Student <span>Management</span> System</a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="students.html" class="active">Students</a></li>
    <li><a href="attendance.html">Attendance</a></li>
    <li><a href="marks.html">Marks</a></li>
    <li><a href="fee.html">Fee</a></li>
    <li><button class="btn-logout" onclick="window.location='login.html'">Logout</button></li>
  </ul>
</nav>

<div class="main">
  <div class="page-header">
    <div>
      <div class="page-title">Students</div>
      <div class="breadcrumb"><a href="index.html">Home</a> &rsaquo; Students</div>
    </div>
    <button class="btn btn-primary" onclick="openAddModal()">+ Add Student</button>
  </div>

  <div class="card">
    <div class="filter-row">
      <input class="search-box" type="text" id="search-input" placeholder="Search by name, roll no...">
      <select id="filter-course" onchange="loadStudents()">
        <option value="">All Courses</option>
        <option>B.Tech</option><option>BCA</option><option>MBA</option>
        <option>B.Sc</option><option>B.Com</option>
      </select>
      <select id="filter-status" onchange="loadStudents()">
        <option value="">All Status</option>
        <option>Active</option><option>Inactive</option>
      </select>
      <button class="btn btn-primary" onclick="loadStudents()">Filter</button>
      <button class="btn btn-secondary" onclick="resetFilters()">Reset</button>
    </div>
    <div id="student-table"><div class="spinner"></div></div>
  </div>
</div>


<div class="modal-overlay" id="student-modal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modal-title">Add Student</span>
      <button class="modal-close" onclick="closeModal('student-modal')">&times;</button>
    </div>

    <div class="section-title">Personal Information</div>
    <div class="form-grid" style="margin-bottom:16px">
      <div class="form-group">
        <label>First Name *</label>
        <input type="text" id="f-firstName" placeholder="First name">
      </div>
      <div class="form-group">
        <label>Last Name *</label>
        <input type="text" id="f-lastName" placeholder="Last name">
      </div>
      <div class="form-group">
        <label>Email *</label>
        <input type="email" id="f-email" placeholder="email@example.com">
      </div>
      <div class="form-group">
        <label>Phone</label>
        <input type="text" id="f-phone" placeholder="+91 XXXXX XXXXX">
      </div>
      <div class="form-group">
        <label>Gender</label>
        <select id="f-gender">
          <option value="">Select</option>
          <option>Male</option><option>Female</option><option>Other</option>
        </select>
      </div>
      <div class="form-group">
        <label>Date of Birth</label>
        <input type="date" id="f-dob">
      </div>
      <div class="form-group full">
        <label>Address</label>
        <textarea id="f-address" placeholder="Full address..."></textarea>
      </div>
    </div>

    <div class="section-title">Academic Details</div>
    <div class="form-grid three">
      <div class="form-group">
        <label>Roll Number *</label>
        <input type="text" id="f-roll" placeholder="e.g. 2024001">
      </div>
      <div class="form-group">
        <label>Course *</label>
        <select id="f-course">
          <option value="">Select Course</option>
          <option>M.E.</option><option>B.E.</option><option>MBA</option>
          <option>B.Com</option><option>B.E.</option> 
        </select>
      </div>
      <div class="form-group">
        <label>Class / Section</label>
        <input type="text" id="f-class" placeholder="e.g. CSE-A">
      </div>
      <div class="form-group">
        <label>Semester</label>
        <select id="f-semester">
          <option>Semester 1</option><option>Semester 2</option>
          <option>Semester 3</option><option>Semester 4</option>
          <option>Semester 5</option><option>Semester 6</option>
          <option>Semester 7</option><option>Semester 8</option>
        </select>
      </div>
      <div class="form-group">
        <label>Admission Year</label>
        <input type="text" id="f-year" placeholder="2024">
      </div>
      <div class="form-group">
        <label>Status</label>
        <select id="f-status">
          <option>Active</option><option>Inactive</option>
        </select>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('student-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveStudent()">Save Student</button>
    </div>
  </div>
</div>

<!-- VIEW MODAL -->
<div class="modal-overlay" id="view-modal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Student Details</span>
      <button class="modal-close" onclick="closeModal('view-modal')">&times;</button>
    </div>
    <div id="view-content"></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('view-modal')">Close</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="api.js"></script>
<script>
  let editId = null;
  let allStudents = [];

  async function loadStudents() {
    const search  = document.getElementById('search-input').value.trim();
    const course  = document.getElementById('filter-course').value;
    const status  = document.getElementById('filter-status').value;
    document.getElementById('student-table').innerHTML = '<div class="spinner"></div>';
    try {
      let data = search
        ? await apiCall('/students/search?keyword=' + encodeURIComponent(search))
        : await apiCall('/students');

      if (course) data = data.filter(s => s.course === course);
      if (status) data = data.filter(s => s.status === status);
      allStudents = data;
      renderTable(data);
    } catch(e) { showToast('Failed to load students', 'error'); }
  }

  function renderTable(data) {
    document.getElementById('student-table').innerHTML = data.length ? `
      <table>
        <thead><tr>
          <th>#</th><th>Name</th><th>Roll No</th><th>Course</th>
          <th>Class</th><th>Email</th><th>Status</th><th>Actions</th>
        </tr></thead>
        <tbody>
          ${data.map(s => `
            <tr>
              <td>${s.id}</td>
              <td><strong>${s.firstName} ${s.lastName}</strong></td>
              <td>${s.rollNumber || '-'}</td>
              <td>${s.course || '-'}</td>
              <td>${s.className || '-'}</td>
              <td>${s.email || '-'}</td>
              <td>${statusBadge(s.status || 'Active')}</td>
              <td>
                <button class="link-btn" onclick="viewStudent(${s.id})">View</button>
                <button class="link-btn" onclick="openEditModal(${s.id})">Edit</button>
                <button class="link-btn danger" onclick="deleteStudent(${s.id})">Delete</button>
              </td>
            </tr>`).join('')}
        </tbody>
      </table>` : '<div class="empty-state">No students found.</div>';
  }

  function openAddModal() {
    editId = null;
    document.getElementById('modal-title').textContent = 'Add Student';
    ['firstName','lastName','email','phone','gender','address',
     'roll','course','class','semester','year'].forEach(f => {
      const el = document.getElementById('f-' + f);
      if (el) el.value = '';
    });
    document.getElementById('f-status').value = 'Active';
    document.getElementById('f-dob').value = '';
    openModal('student-modal');
  }

  function openEditModal(id) {
    const s = allStudents.find(x => x.id === id);
    if (!s) return;
    editId = id;
    document.getElementById('modal-title').textContent = 'Edit Student';
    document.getElementById('f-firstName').value = s.firstName || '';
    document.getElementById('f-lastName').value  = s.lastName  || '';
    document.getElementById('f-email').value     = s.email     || '';
    document.getElementById('f-phone').value     = s.phone     || '';
    document.getElementById('f-gender').value    = s.gender    || '';
    document.getElementById('f-dob').value       = s.dateOfBirth || '';
    document.getElementById('f-address').value   = s.address   || '';
    document.getElementById('f-roll').value      = s.rollNumber || '';
    document.getElementById('f-course').value    = s.course    || '';
    document.getElementById('f-class').value     = s.className || '';
    document.getElementById('f-semester').value  = s.semester  || 'Semester 1';
    document.getElementById('f-year').value      = s.admissionYear || '';
    document.getElementById('f-status').value    = s.status    || 'Active';
    openModal('student-modal');
  }

  async function saveStudent() {
    const student = {
      firstName:    document.getElementById('f-firstName').value,
      lastName:     document.getElementById('f-lastName').value,
      email:        document.getElementById('f-email').value,
      phone:        document.getElementById('f-phone').value,
      gender:       document.getElementById('f-gender').value,
      dateOfBirth:  document.getElementById('f-dob').value,
      address:      document.getElementById('f-address').value,
      rollNumber:   document.getElementById('f-roll').value,
      course:       document.getElementById('f-course').value,
      className:    document.getElementById('f-class').value,
      semester:     document.getElementById('f-semester').value,
      admissionYear:document.getElementById('f-year').value,
      status:       document.getElementById('f-status').value,
    };
    if (!student.firstName || !student.lastName) {
      return showToast('First and last name are required', 'error');
    }
    try {
      if (editId) {
        await apiCall('/students/' + editId, 'PUT', student);
        showToast('Student updated successfully');
      } else {
        await apiCall('/students', 'POST', student);
        showToast('Student added successfully');
      }
      closeModal('student-modal');
      loadStudents();
    } catch(e) { showToast('Error saving student: ' + e.message, 'error'); }
  }

  async function deleteStudent(id) {
    if (!confirm('Are you sure you want to delete this student?')) return;
    try {
      await apiCall('/students/' + id, 'DELETE');
      showToast('Student deleted');
      loadStudents();
    } catch(e) { showToast('Error deleting student', 'error'); }
  }

  async function viewStudent(id) {
    const s = allStudents.find(x => x.id === id);
    if (!s) return;
    document.getElementById('view-content').innerHTML = `
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:13px">
        <div><span style="color:#64748b">Name:</span><br><strong>${s.firstName} ${s.lastName}</strong></div>
        <div><span style="color:#64748b">Roll No:</span><br><strong>${s.rollNumber || '-'}</strong></div>
        <div><span style="color:#64748b">Email:</span><br>${s.email || '-'}</div>
        <div><span style="color:#64748b">Phone:</span><br>${s.phone || '-'}</div>
        <div><span style="color:#64748b">Course:</span><br>${s.course || '-'}</div>
        <div><span style="color:#64748b">Class:</span><br>${s.className || '-'}</div>
        <div><span style="color:#64748b">Semester:</span><br>${s.semester || '-'}</div>
        <div><span style="color:#64748b">Admission Year:</span><br>${s.admissionYear || '-'}</div>
        <div><span style="color:#64748b">Gender:</span><br>${s.gender || '-'}</div>
        <div><span style="color:#64748b">Status:</span><br>${statusBadge(s.status || 'Active')}</div>
        <div style="grid-column:1/-1"><span style="color:#64748b">Address:</span><br>${s.address || '-'}</div>
      </div>`;
    openModal('view-modal');
  }

  function resetFilters() {
    document.getElementById('search-input').value = '';
    document.getElementById('filter-course').value = '';
    document.getElementById('filter-status').value = '';
    loadStudents();
  }

  document.getElementById('search-input').addEventListener('keyup', e => {
    if (e.key === 'Enter') loadStudents();
  });

  
  if (new URLSearchParams(window.location.search).get('action') === 'add') openAddModal();

  loadStudents();
</script>
</body>
</html>
