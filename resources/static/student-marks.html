<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Marks - SMS</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar">
  <a class="navbar-brand" href="student-dashboard.html">Student <span>Portal</span></a>
  <ul class="nav-links">
    <li><a href="student-dashboard.html">My Profile</a></li>
    <li><a href="student-attendance.html">My Attendance</a></li>
    <li><a href="student-marks.html" class="active">My Marks</a></li>
    <li><a href="student-fee.html">My Fee</a></li>
    <li><div id="navbar-user" style="display:inline-flex;align-items:center;"></div></li>
    <li><button class="btn-logout" onclick="doLogout()">Logout</button></li>
  </ul>
</nav>
<div class="main">
  <div class="page-header">
    <div>
      <div class="page-title">My Marks</div>
      <div class="breadcrumb">Student Portal &rsaquo; My Marks</div>
    </div>
  </div>
  <div class="card">
    <div class="card-header">
      <span class="card-title">Subject-wise Marks</span>
    </div>
    <div id="marks-table"><div class="spinner"></div></div>
  </div>
</div>

<div id="toast" class="toast"></div>
<script src="auth.js"></script>
<script>
async function init() {
  const user = await requireRole('STUDENT');
  if (!user) return;
  renderNavbar(user);
  if (!user.studentId) {
    document.getElementById('marks-table').innerHTML =
      '<div class="empty-state">Student record not linked. Contact admin.</div>';
    return;
  }
  try {
    const data = await apiCall('/marks/student/' + user.studentId);
    document.getElementById('marks-table').innerHTML = data.length ? `
      <table>
        <thead><tr>
          <th>Subject</th><th>Semester</th>
          <th>Marks</th><th>Grade</th><th>Result</th>
        </tr></thead>
        <tbody>
          ${data.map(m => `
            <tr>
              <td>${m.subject || '-'}</td>
              <td>${m.semester || '-'}</td>
              <td><strong>${m.marks}</strong> / ${m.maxMarks || 100}</td>
              <td><span class="badge ${m.marks>=60?'badge-success':m.marks>=40?'badge-warning':'badge-danger'}">${m.grade}</span></td>
              <td>${statusBadge(m.marks >= 40 ? 'Pass' : 'Fail')}</td>
            </tr>`).join('')}
        </tbody>
      </table>` : '<div class="empty-state">No marks records found.</div>';
  } catch(e) { showToast('Error loading marks', 'error'); }
}
init();
</script>
</body>
</html>
