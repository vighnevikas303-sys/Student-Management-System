<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Attendance - SMS</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar">
  <a class="navbar-brand" href="student-dashboard.html">Student <span>Portal</span></a>
  <ul class="nav-links">
    <li><a href="student-dashboard.html">My Profile</a></li>
    <li><a href="student-attendance.html" class="active">My Attendance</a></li>
    <li><a href="student-marks.html">My Marks</a></li>
    <li><a href="student-fee.html">My Fee</a></li>
    <li><div id="navbar-user" style="display:inline-flex;align-items:center;"></div></li>
    <li><button class="btn-logout" onclick="doLogout()">Logout</button></li>
  </ul>
</nav>
<div class="main">
  <div class="page-header">
    <div>
      <div class="page-title">My Attendance</div>
      <div class="breadcrumb">Student Portal &rsaquo; My Attendance</div>
    </div>
  </div>
  <div class="stats-grid">
    <div class="stat-card blue">
      <div class="stat-label">Total Days</div>
      <div class="stat-value" id="stat-total">--</div>
    </div>
    <div class="stat-card green">
      <div class="stat-label">Present</div>
      <div class="stat-value" id="stat-present">--</div>
    </div>
    <div class="stat-card red">
      <div class="stat-label">Absent</div>
      <div class="stat-value" id="stat-absent">--</div>
    </div>
    <div class="stat-card amber">
      <div class="stat-label">Percentage</div>
      <div class="stat-value" id="stat-pct" style="font-size:22px">--</div>
    </div>
  </div>
  <div class="card">
    <div class="card-header">
      <span class="card-title">Attendance Records</span>
    </div>
    <div id="att-table"><div class="spinner"></div></div>
  </div>
</div>

<div id="toast" class="toast"></div>
<script src="auth.js"></script>
<script>
async function init() {
  const user = await requireRole('STUDENT');
  if (!user) return;
  renderNavbar(user);
  if (!user.studentId) {
    document.getElementById('att-table').innerHTML =
      '<div class="empty-state">Student record not linked. Contact admin.</div>';
    return;
  }
  try {
    const data = await apiCall('/attendance/student/' + user.studentId);
    const present = data.filter(a => a.status === 'Present').length;
    const absent  = data.filter(a => a.status === 'Absent').length;
    const pct     = data.length ? Math.round((present / data.length) * 100) : 0;
    document.getElementById('stat-total').textContent   = data.length;
    document.getElementById('stat-present').textContent = present;
    document.getElementById('stat-absent').textContent  = absent;
    document.getElementById('stat-pct').textContent     = pct + '%';
    document.getElementById('att-table').innerHTML = data.length ? `
      <table>
        <thead><tr><th>Date</th><th>Status</th></tr></thead>
        <tbody>
          ${data.map(a => `
            <tr>
              <td>${a.date}</td>
              <td>${statusBadge(a.status)}</td>
            </tr>`).join('')}
        </tbody>
      </table>` : '<div class="empty-state">No attendance records found.</div>';
  } catch(e) { showToast('Error loading attendance', 'error'); }
}
init();
</script>
</body>
</html>
